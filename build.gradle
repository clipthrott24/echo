buildscript {
  repositories {
    gradlePluginPortal()
  }

  dependencies {
    classpath "io.spinnaker.gradle:spinnaker-project-plugin:$spinnakerGradleVersion"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    classpath "com.adarshr:gradle-test-logger-plugin:4.0.0"
  }

  configurations.classpath {
    resolutionStrategy {
      // The ospackage plugin pulled in by io.spinnaker.project builds against
      // Gradle internals that changed in Gradle 8.
      force "com.netflix.nebula:gradle-ospackage-plugin:11.11.2"
    }
  }
}

apply plugin: 'com.adarshr.test-logger'

allprojects {
  apply plugin: "io.spinnaker.project"

  spinnakerCodeStyle {
    enabled = false
  }

  apply plugin: "com.diffplug.spotless"

  spotless {
    java {
      target "src/**/*.java"
      googleJavaFormat("1.17.0")
      removeUnusedImports()
      trimTrailingWhitespace()
      endWithNewline()
    }
  }

  plugins.withId("org.jetbrains.kotlin.jvm") {
    spotless {
      kotlin {
        ktlint("0.50.0")
      }
    }
  }
}

subprojects {
  group = "io.spinnaker.echo"

  if ([korkVersion, fiatVersion].find { it.endsWith("-SNAPSHOT") }) {
    repositories {
      mavenLocal()
    }
  }

  if (name != "echo-bom") {
    apply plugin: "java-library"
    apply plugin: "groovy"
    apply plugin: 'jacoco'
    apply plugin: 'com.adarshr.test-logger'

    java {
      sourceCompatibility = JavaVersion.VERSION_21
      targetCompatibility = JavaVersion.VERSION_21
      toolchain {
        languageVersion = JavaLanguageVersion.of(21)
      }
    }

    test {
      useJUnitPlatform()
      testLogging {
        exceptionFormat = 'full'
      }
    }

    tasks.withType(JavaExec) {
      if (System.getProperty('DEBUG', 'false') == 'true') {
        jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=8189'
      }
    }
  }

  if (name != "echo-bom" && name != "echo-api") {
    jacoco {
      toolVersion = '0.8.12'
    }

    dependencies {
      constraints {
        // kork-bom stopped managing okhttp 2.x, which the retrofit 1 clients
        // still use.
        implementation "com.squareup.okhttp:okhttp:2.7.5"
        implementation "com.squareup.okhttp:okhttp-urlconnection:2.7.5"
        implementation "com.squareup.okhttp:okhttp-apache:2.7.5"
      }

      implementation platform("io.spinnaker.kork:kork-bom:$korkVersion")
      annotationProcessor platform("io.spinnaker.kork:kork-bom:$korkVersion")
      annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")
      testAnnotationProcessor platform("io.spinnaker.kork:kork-bom:$korkVersion")
      compileOnly "org.projectlombok:lombok"
      annotationProcessor "org.projectlombok:lombok"
      testAnnotationProcessor "org.projectlombok:lombok"

      implementation "org.apache.groovy:groovy"
      implementation "org.apache.groovy:groovy-json"
      implementation "javax.validation:validation-api"
      testRuntimeOnly "org.junit.vintage:junit-vintage-engine"
      testRuntimeOnly "org.junit.platform:junit-platform-launcher"
      implementation "com.github.ben-manes.caffeine:guava"
      implementation "com.netflix.spectator:spectator-api"
      implementation "org.slf4j:slf4j-api"
      implementation "net.logstash.logback:logstash-logback-encoder"
      implementation "org.springframework.boot:spring-boot-properties-migrator"

      testImplementation "org.spockframework:spock-core"

      testImplementation "org.springframework.boot:spring-boot-starter-test"
      testImplementation "org.spockframework:spock-core"
      testImplementation "org.spockframework:spock-spring"
      testImplementation "org.springframework:spring-test"
      testImplementation "org.hamcrest:hamcrest-core"
      testRuntimeOnly "cglib:cglib-nodep"
      testRuntimeOnly "org.objenesis:objenesis"
    }
  }
}

defaultTasks ':echo-web:run'
